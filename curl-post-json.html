          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use -d with the JSON and add the header -H \"Content-Type: application/json\", for example: curl -H \"Content-Type: application/json\" -d '{\"name\":\"Emily\"}' https://api.example.com/users. With curl 7.82 or newer, curl --json '{\"name\":\"Emily\"}' URL does the same."

          "@type": "Question",
          "name": "Why does the server not see my JSON body?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Without the Content-Type: application/json header, curl sends the body as application/x-www-form-urlencoded, and many frameworks then ignore it or return 400 or 415. Add the header or use --json."

        },
        {
          "@type": "Question",
          "name": "Why does curl send invalid JSON on Windows?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Windows PowerShell 5.1 strips the double quotes inside single-quoted JSON, and cmd.exe does not treat single quotes as quotes at all. Escape each double quote as \\\" or send the JSON from a file with --data-binary @file.json."
          }
        },
        {
          "@type": "Question",
          "name": "How do I send a JSON file with curl?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Put @ before the file name: curl -H \"Content-Type: application/json\" --data-binary @data.json URL, or curl --json @data.json URL. --data-binary keeps the file exactly as written, while -d removes line breaks."
