<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Online JSON Formatter</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fc;
        color: #1a1a2e;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .box {
        background: #fff;
        padding: 40px 32px;
        border-radius: 12px;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      }
      h1 { font-size: 64px; margin: 0; color: #1d4ed8; }
      h2 { margin: 8px 0 12px; }
      p { color: #555; line-height: 1.6; }
      .links { display: grid; gap: 10px; margin-top: 24px; }
      .links a {
        display: block;
        padding: 12px;
        border: 1px solid #d6e0f5;
        border-radius: 8px;
        color: #1d4ed8;
        text-decoration: none;
        font-weight: bold;
      }
      .links a:hover { background: #eef3ff; }
      .home { background: #1d4ed8; color: #fff !important; }
      .home:hover { background: #1e40af !important; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>404</h1>
      <h2>Page not found</h2>
      <p>The page you are looking for doesn't exist or has been moved. Try one of our free JSON tools instead:</p>
      <div class="links">
        <a class="home" href="/">JSON Formatter</a>
        <a href="/json-viewer">JSON Viewer</a>
        <a href="/json-validator">JSON Validator</a>
        <a href="/json-to-csv">JSON to CSV</a>
        <a href="/csv-to-json">CSV to JSON</a>
        <a href="/common-json-errors">Common JSON Errors</a>
      </div>
    </div>
  </body>
</html>
